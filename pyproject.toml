[project]
name = "pcr"
version = "0.2.0"
description = "Evidence-grounded process-change reconstruction with LLMs (IEEE Access revision)"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
